name: Local demo (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-demo
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.2
          cache: npm
      - run: npm ci
      - name: Build browser-local demo
        env:
          VITE_LOCAL_MODE: '1'
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build:local
      - uses: actions/upload-pages-artifact@v4.0.0
        with:
          path: dist/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Private repos without Pages enabled fail deploy with 404; do not red the branch.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4.0.5
