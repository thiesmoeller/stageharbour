name: Local demo (GitHub Pages)
# The public browser demo is built from the `dev` branch. This workflow file on
# `main` only documents that; pushes to `dev` run the copy of this file there.
on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Emergency rebuild from main (prefer pushing to dev)'
        required: false
        default: ''
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-demo
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: dev
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.2
          cache: npm
      - run: npm ci
      - name: Build browser-local demo from dev
        env:
          VITE_LOCAL_MODE: '1'
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build:local
      - uses: actions/upload-pages-artifact@v4.0.0
        with:
          path: dist/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4.0.5
