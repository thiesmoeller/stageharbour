name: hts-stage-planner
services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: stage_planner
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: stage_planner
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stage_planner -d stage_planner"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
