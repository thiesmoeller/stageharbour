name: hts-stage-planner
services:
  backend:
    profiles: [app]
    build: .
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://stage_planner:local-development-only@db:5432/stage_planner
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      APP_ORIGIN: ${DEPLOY_APP_ORIGIN:-https://localhost}
      STORAGE_DIR: /data/storage
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3000}:3000"
    volumes:
      - asset-data:/data/storage
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: stage_planner
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: stage_planner
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stage_planner -d stage_planner"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
  asset-data:
